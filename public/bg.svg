<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#eef7fd"/>
    </linearGradient>

    <linearGradient id="blueSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#59b8e8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#29629d" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="blueStrong" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#59b8e8" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#29629d" stop-opacity="0.72"/>
    </linearGradient>

    <linearGradient id="redSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e82e2e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d11217" stop-opacity="0.42"/>
    </linearGradient>

    <pattern id="dotsBlue" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#59b8e8" opacity="0.22"/>
    </pattern>

    <pattern id="dotsRed" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#d11217" opacity="0.22"/>
    </pattern>

    <filter id="blurSmall">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- subtle corner dot fields -->
  <rect x="35" y="15" width="270" height="160" fill="url(#dotsBlue)" opacity="0.55"/>
  <rect x="1270" y="10" width="330" height="180" fill="url(#dotsBlue)" opacity="0.38"/>
  <rect x="360" y="850" width="300" height="170" fill="url(#dotsBlue)" opacity="0.45"/>
  <rect x="1720" y="825" width="180" height="180" fill="url(#dotsRed)" opacity="0.45"/>

  <!-- left layered translucent geometry -->
  <path d="M0 135 L245 380 Q280 415 245 452 L0 705 Z" fill="url(#blueStrong)"/>
  <path d="M0 95 L315 410 Q345 440 312 477 L0 790 Z" fill="#59b8e8" opacity="0.11"/>
  <path d="M0 230 L120 350 Q145 375 120 405 L0 530 Z" fill="#29629d" opacity="0.18"/>

  <!-- large lower-left glass layer -->
  <path d="M0 580 L540 1080 L0 1080 Z" fill="url(#blueSoft)"/>
  <path d="M0 680 L420 1080 L0 1080 Z" fill="#59b8e8" opacity="0.08"/>

  <!-- right diagonal layers -->
  <path d="M1920 575 L1450 1045 L1550 1080 L1920 710 Z" fill="#29629d" opacity="0.60"/>
  <path d="M1920 515 L1360 1075 L1445 1080 L1920 605 Z" fill="#59b8e8" opacity="0.28"/>
  <path d="M1920 665 L1505 1080 L1650 1080 L1920 810 Z" fill="#245386" opacity="0.52"/>
  <path d="M1920 410 L1790 540 Q1762 568 1792 598 L1920 725 Z" fill="url(#redSoft)"/>

  <!-- central soft wave lines -->
  <g fill="none" stroke="#59b8e8" stroke-opacity="0.16" stroke-width="1.4">
    <path d="M145 495 C430 360 680 650 980 690 C1230 724 1370 555 1545 505"/>
    <path d="M150 505 C440 370 690 660 990 700 C1240 735 1382 566 1554 515"/>
    <path d="M155 515 C450 380 700 670 1000 710 C1250 745 1394 577 1563 525"/>
    <path d="M160 525 C460 390 710 680 1010 720 C1260 755 1406 588 1572 535"/>
    <path d="M165 535 C470 400 720 690 1020 730 C1270 765 1418 599 1581 545"/>
    <path d="M170 545 C480 410 730 700 1030 740 C1280 775 1430 610 1590 555"/>
    <path d="M175 555 C490 420 740 710 1040 750 C1290 785 1442 621 1599 565"/>
  </g>

  <!-- subtle arc at bottom -->
  <path d="M820 1060 Q1110 865 1380 1080" fill="none" stroke="#59b8e8" stroke-width="30" stroke-opacity="0.08"/>
  <path d="M890 1060 Q1120 920 1315 1080" fill="none" stroke="#29629d" stroke-width="14" stroke-opacity="0.06"/>

  <!-- circuit details -->
  <g fill="none" stroke="#59b8e8" stroke-opacity="0.30" stroke-width="2">
    <path d="M1540 180 H1660 L1710 130 H1815"/>
    <path d="M1570 220 H1675 L1728 166 H1855"/>
    <circle cx="1540" cy="180" r="6" fill="#ffffff"/>
    <circle cx="1570" cy="220" r="6" fill="#ffffff"/>
    <circle cx="1815" cy="130" r="5" fill="#ffffff"/>
    <circle cx="1855" cy="166" r="5" fill="#ffffff"/>
  </g>

  <g fill="none" stroke="#29629d" stroke-opacity="0.18" stroke-width="2">
    <path d="M0 900 H165 L205 860 H280"/>
    <path d="M0 944 H210 L252 902 H345"/>
    <circle cx="280" cy="860" r="6" fill="#ffffff"/>
    <circle cx="345" cy="902" r="6" fill="#ffffff"/>
  </g>

  <!-- faint decorative curves top-left -->
  <g fill="none" stroke="#59b8e8" stroke-opacity="0.12" stroke-width="1">
    <path d="M0 0 C70 30 95 95 125 155"/>
    <path d="M0 0 C95 40 120 110 155 175"/>
    <path d="M0 0 C120 55 145 125 185 195"/>
    <path d="M0 0 C145 65 170 145 215 215"/>
  </g>

  <!-- edge highlights -->
  <path d="M0 98 L316 412" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
  <path d="M1360 1074 L1918 516" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
</svg>
